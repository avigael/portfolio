<li class="mb-12">
  <div
    class="group relative grid pb-1 transition-all sm:grid-cols-8 sm:gap-8 md:gap-4 lg:hover:!opacity-100 lg:group-hover/list:opacity-50"
  >
    <div
      class="absolute -inset-x-4 -inset-y-4 z-0 hidden rounded-md transition motion-reduce:transition-none lg:-inset-x-6 lg:block lg:group-hover:bg-zinc-900/60 lg:group-hover:shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05)] lg:group-hover:drop-shadow-lg"
    ></div>
    <header
      class="z-10 mb-2 mt-1 text-xs font-semibold uppercase tracking-wide text-zinc-600 sm:col-span-2"
      attr.aria-label="{{ experience.startDate }} to {{ experience.endDate }}"
    >
      {{ experience.startDate }} &mdash; {{ experience.endDate }}
    </header>
    <div class="z-10 sm:col-span-6">
      <h3 class="font-medium leading-snug text-zinc-200">
        <div>
          <span>{{ experience.title }} &middot; {{ experience.organization }}</span>
        </div>
      </h3>
      <p class="mt-2 text-sm leading-normal">
        {{ experience.description }}
      </p>
      <ul
        *ngIf="experience.highlights?.length"
        class="mt-3 space-y-2 text-sm leading-normal"
        aria-label="Selected accomplishments"
      >
        <li
          *ngFor="let highlight of experience.highlights"
          class="relative pl-4 before:absolute before:left-0 before:text-zinc-500 before:content-['•']"
        >
          {{ highlight }}
        </li>
      </ul>
      <ul class="mt-2 flex flex-wrap" aria-label="Technologies used">
        <ng-container *ngFor="let tag of experience.tags">
          <li class="mr-1.5 mt-2">
            <div
              class="flex items-center rounded-full bg-zinc-800/80 px-3 py-1 text-xs font-medium leading-5 text-zinc-300 ring-1 ring-inset ring-white/5"
            >
              {{ tag }}
            </div>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</li>
